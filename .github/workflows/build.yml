name: Build ESP Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Android SDK packages
        run: |
          # 使用已安装的 cmdline-tools
          SDK_CMD="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          # 如果 latest 不存在，找具体版本
          if [ ! -f "$SDK_CMD" ]; then
            SDK_CMD=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -1)
          fi
          
          # 逐个安装，避免参数解析问题
          yes | "$SDK_CMD" "platform-tools"
          yes | "$SDK_CMD" "platforms;android-34"
          yes | "$SDK_CMD" "build-tools;34.0.0"
          yes | "$SDK_CMD" "ndk;26.1.10909125"
          
      - name: Grant execute permission
        run: chmod +x gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esp-overlay-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
